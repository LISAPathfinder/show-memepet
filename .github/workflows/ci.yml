name: CI

# 只跑纯逻辑回归件（清单以 `run: node tools/…` 步骤为准，动态解析、不手抄件数）。
# 为什么有 npm ci：verify-archive-import 依赖 adm-zip 与 7z-wasm（纯 JS/WASM，无原生编译，
#   --ignore-scripts 下 electron 不触发二进制下载）；verify-checkjs 与 verify-checkjs-tiers 依赖 typescript
#   （devDep，精确 pin——棘轮读数随编译器版本整体漂，禁 ^）。其余件零第三方依赖。
# 为什么没有装 Electron：test-layout-menu / verify-walk / test-data-root / verify-pass-hold /
#   verify-identity / verify-autostart-migration / verify-single-writer / verify-fallback-box /
#   verify-rebuild-grace / verify-hit-region / verify-unlock-position / verify-box-cadence /
#   verify-ctrl-reconcile / verify-build-files / verify-docs-structure / verify-toast-aumid-order
#   verify-tripleclick-trace
#   这些件零第三方依赖，
#   只 require 仓库内 js 与 node 内置模块（config.js 的 require('electron') 是函数内惰性调用，
#   纯 node 下走不到那条分支），所以 checkout + node 即可跑，不必装 Electron、不必编译原生模块。
#   其中 `verify-single-writer` / `verify-hit-region` / `verify-unlock-position` / `verify-box-cadence` /
#   `verify-ctrl-reconcile`
#   这一类源码提取件（1.0.57 起）**只读源码文本或在 vm 里求值**，且**不许**接实例、不许加 exit 3
#   （票 11-G 硬约束：给 CI 里跑的纯逻辑件加占用自检＝自己造红灯）。
# 为什么是 windows-latest：项目范围锁死「仅 Windows」，与产品语义一致。这些件在 linux 上
#   的可移植性未实测（作者机器无 linux node 环境），故不按「应该能跑」写 ubuntu runner。
# 为什么不放连调试端口的那批（verify-passthrough / verify-passthrough-desync / verify-cursor-sync /
#   verify-main-passthrough / verify-rescue / measure-ignore-storm / verify-scale 等）与
#   verify-petcovered-alpha：它们需要真实桌面会话、独占实例（其中 13 件 verify-* 会主动
#   exit 3 拒绝装机版实例在场）、koffi 造窗与真实光标路由，CI 上测不出真结论。

on:
  push:
    branches: [main, publish]
  pull_request:

jobs:
  logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 仅 verify-archive-import 需要 adm-zip / 7z-wasm（纯 JS/WASM）；--ignore-scripts
      # 跳过 electron 的二进制下载 postinstall（CI 纯逻辑件不需要 electron.exe）
      - name: 安装依赖（跳过 postinstall）
        run: npm ci --ignore-scripts --no-audit --no-fund

      # 本机实测基线（2026-10-02，node v24）：13 pass / 45 通过 / 7 pass / 全通过，均 exit 0
      - name: 菜单弹出几何（13 用例）
        run: node tools/test-layout-menu.js

      - name: 走过去纯逻辑（三击判定/冷却/时长钳制/朝向/落点）
        run: node tools/verify-walk.js

      - name: 数据根定位（7 用例）
        run: node tools/test-data-root.js

      - name: 穿透判定状态机（10 场景，含大幅离开快速通道）
        run: node tools/verify-pass-hold.js

      # 名字单一真源守卫（票 11-A）：identity.js ↔ package.json 四项逐项比对 + tools 裸字面量扫描。
      # 漏改一处从静默失效变必红；票 11-B 改名的前后都必须过这一步
      - name: 名字一致性（identity ↔ package.json）
        run: node tools/verify-identity.js

      # 自启注册表读回纯函数（票 11-C 任务 1d 立件，票 11-Q 判据换轨）：实机 dump 形态夹具，
      # 含重写版「11-B 回归基线」——旧缺陷正则命中 0（夹具保真）+ 活判据 findRunEntry 命中 1，
      # 行首空白容忍钉在还在跑的读回路径上，防再写出失配正则的红灯
      - name: 自启注册表读回纯函数（含 11-B 回归基线重写版）
        run: node tools/verify-autostart-migration.js

      # 穿透单写入者的源码级守卫（1.0.57 加固轮）：渲染端无写入口 = 结构性事实，
      # 件里第 1、2 条是正向对照（主进程那个唯一写入者必须在位），防"读不到就打绿灯"
      - name: 穿透单写入者（源码守卫）
        run: node tools/verify-single-writer.js

      # 兜底可交互区派生（票 11-G 任务 3）：从 main.js 提取切片在 vm 里求值，
      # 断言兜底盒右下角恒贴 (600,600)——1.0.55 及以前的写死常量落在固定窗空白左上角
      - name: 兜底可交互区派生
        run: node tools/verify-fallback-box.js

      # 重建/首屏命中区宽限期（1.0.58，用户实机反馈 ○g=B）：断言宽限内并集覆盖未渲染的计数区、
      # 宽限过后退回上报盒、透明空白仍放行——三向都考，防"为了修第一次点击把整窗变成可点"
      - name: 重建命中区宽限期
        run: node tools/verify-rebuild-grace.js

      # 命中区与余量红线（票 11-J 任务 1 判据件）：vm 提取 interactiveBox+pointInBoxes 造现场 3 真实矩形，
      # 断言本体区内/空隙区外/远点区外/脸中心正向对照/吞点击面积 ≤1.2× 元素真实面积（实算 1.172×）。
      # 改前副本实测 2.024× exit 1（空隙点 3/3 被吞）——改 pad 前先让这件立起来，参数手感让位给读数
      - name: 命中区判据（含 1.2× 余量红线）
        run: node tools/verify-hit-region.js

      # 解锁/唤醒位置归位判据（票 11-K）：vm 提取 resolvePetPosition/延迟复查函数注入桩显示器，
      # 断言 defer 路径出屏不弹回主屏（先按保存位置建窗+复查拉回）、真拔屏才归位默认且决策落日志、
      # defer 传递链（unlock→recreate→create→resolve）在位——防「解锁后桌宠跳回右下角」回归
      - name: 解锁位置归位判据（票 11-K）
        run: node tools/verify-unlock-position.js

      # 上报节奏判据（票 11-L / 11-J 任务 2b）：vm 提取 interactiveBox/boxSignature/reportInteractiveBox
      # 注入桩 DOM，断言 rAF 帧驱动 + 3px 量化（缓动不帧级 IPC、突变一帧即报）、1s 兜底与点名通道
      # 在位——防「主进程手里的盒可陈旧 1s」（第四层根因）回退
      - name: 上报节奏判据（票 11-L）
        run: node tools/verify-box-cadence.js

      # Ctrl 显隐状态对账自愈判据（票 11-S 任务 1）：vm 提取 petCtrlState/pushPetCtrlState/trackPetCtrl/
      # reconcileCtrlState 注入可编程 GetAsyncKeyState 桩，断言两拍门槛（闩住后两拍 ⇒ 恰一次 down:false
      # 推送+对账日志、单拍必须零推送、真按住不误纠、丢 keydown 方向）与 bootApp 函数体内
      # setInterval(reconcileCtrlState, ≤2000) 接线（按函数体定界，禁全局 includes 恒绿守卫）——
      # f31b6ba 的自愈路径此前零判据零日志（装机「Ctrl 状态对账」0 命中）
      - name: Ctrl 对账自愈判据（票 11-S）
        run: node tools/verify-ctrl-reconcile.js

      # 打包输入闭包钉子：从 main.js/preload.js 递归求 require('./x') 相对闭包 + loadFile 目标，
      # 断言闭包 ⊆ build.files 且 build.files 无死登记（renderer/** 与 resources/icon.ico 走显式豁免表）——
      # 「新增 require 忘登记进打包清单」从靠人记两步变成必红（两处同时漏登就无声的洞，票 11-D 差点踩）。
      # verify-asar.js 的比对清单由本件的派生函数供给（单一事实源，手抄清单已废除）
      - name: 打包输入闭包钉子（require 闭包 ↔ build.files）
        run: node tools/verify-build-files.js

      # 久坐提醒三态判据（票 13-B，2026-10-13 立）：菜单从「开关 + 是否发通知」两个独立勾改成
      # 「关闭／仅桌宠气泡／同时发 Windows 通知」一项三态后，四个回归形态各有一条必红断言——
      # ①真值表（notify 仍是气泡+toast、bubble 绝不发 toast）②迁移等价性（4 组旧输入下显示行为
      # 与旧代码逐组一致，只看输出形状拦不住口径替换）③结构对齐（每个模式在 menuActions 都有
      # reminder-<mode> 动作、菜单文案表有标签——漏登记会被 runMenuAction 的前缀分支静默吞掉）
      # ④不留双真源（main.js 不再读旧两键、config.js 里旧键只出现在读 saved 的迁移行、DEFAULTS
      # 的新键取 core 常量而不是又写一遍字面量）。扫描面只取代码行（注释里提旧键名是讲历史）
      - name: 久坐提醒三态判据（真值表／迁移等价／菜单动作对齐）
        run: node tools/verify-reminder-mode.js

      # PITFALLS 条目结构断言（2026-10-10 立）：「新坑条目掉进 ## 十 之后」这一错位已实翻车三次
      # （§86/87/88、§91 同型、§96=17cf8b4 又掉进 1172 行「## 十、复盘」之后，靠肉眼 grep 才发现）——
      # 口头自检被证伪，改机器断言：R1 末章隔离（锚找不到也红）/ R2 条号唯一（46 历史重号进豁免表）/
      # R3 max==次大+1（防跳号）/ R4 读数下限（≥50 条且 max≥90，防读空假绿）
      - name: PITFALLS 条目结构断言
        run: node tools/verify-docs-structure.js

      # 压缩包导入回归（35 断言，纯 node；2026-10-09 从「无标记不执行」桶升入强制层）：
      # 现场构造真实 zip（adm-zip）/7z/tar/tar.gz（7z-wasm 建包）再调真 skins.importArchive，
      # 断言魔数识别、子目录平铺、穿越条目不外逃、重名递增、无图抛错、临时目录无残留——
      # 改动 skins.js 导入逻辑后此件必跑；本仓唯二需要 npm ci 的件之一（另一件 verify-checkjs
      # 依赖 typescript 精确 pin 5.9.3，见文件头「为什么有 npm ci」；本件依赖 adm-zip / 7z-wasm 纯 JS/WASM）
      - name: 压缩包导入回归（真实建包/真模块导入）
        run: node tools/verify-archive-import.js

      # checkJs 静态层棘轮（票 11-Z，2026-10-11 立）：tsc --noEmit + allowJs/checkJs（tsconfig.checkjs.json，
      # include 根 *.js + renderer/**/*.js + types/**/*.d.ts）对源码全量类型检查，断言 ①错误条数只降不升
      # （BASELINE=23 + 逐文件现算 @ typescript 5.9.3 精确 pin；基线无键=新文件冒错误=红）
      # ②petAPI ambient 在位（types/globals.d.ts 被摘必须立刻红，不靠总条数偶然没涨）
      # ③下限防御（解析 0 条必红——tsc 没跑起来/checkJs 被关不许伪装成通过）
      # ④只降不升（实际<基线才明打「基线可下调 N 条」仍 exit 0；门控＝c 且 e 且 f——缩面/缺件时绝无
      # 下调提示）。dev 面文件不进 build.files、不产构建物
      # ⑤检查面覆盖（票 11-Z4）：build.files 派生的打包 js 面 == tsc --listFilesOnly 实际输入面，
      # 双向点名——拦「include 缩面 / glob 深度漂移 / 白名单漂移」被伪装成基线下降
      # ⑥加载面覆盖（票 11-Z5）：html 的 script src 才是权威加载清单——拦「产品 js 被删/改名而 html
      # 没同步」（e 条对目录条目枚举现存文件，文件消失 A/B 同步缩小看不见）；单向 C⊆B，不判反向
      # ⑥的 f₂ 扩面（票 11-Z6）：createElement('script') 造加载器这条特征同时扫 B 面全部 js（不只 html），
      # 命中即红——有人用脚本造加载器时「加载清单能从静态文本推出」的前提就失效了
      - name: checkJs 静态层棘轮（tsc --noEmit）
        run: node tools/verify-checkjs.js

      # checkJs 分档棘轮（票 14-L，CI 第 19 件）：严格档（tsconfig.tier-*.json，glob 枚举）逐档三组断言——
      # T1 档枚举与登记表双向相等（删档文件/漏登记必红）、T2 应检面＝手写 manifest 与 tsc 实际输入双向相等
      # （改 include 不改 manifest 也红——堵并集法「漏一个 glob 静默空转」）、T3 棘轮 + T4 基线台账
      # （n 上调必带 history 票号+理由，只改数字不补记录必红）。基础档 tsconfig.checkjs.json 仍由
      # verify-checkjs 管（a–f₂ 不动）；依赖 typescript（与上一件同款 devDep 精确 pin）。
      # ⚠ 分档 tsconfig 的 extends 是逐属性覆盖：基档显式 noImplicitAny:false 会在子档 strict:true 下存活，
      #   tier 两条旗标必须都显式写 true，否则 TS7006 一条不报、棘轮空转（开档实测，见件头注释）。
      - name: checkJs 分档棘轮（严格档 manifest＋基线台账）
        run: node tools/verify-checkjs-tiers.js

      # koffi 绑定 ⇄ native 能力契约接线闸（票 14-M 任务 4b，CI 第 20 件）：源码级双向相等——
      # main.js / tools/inject-click.js 的 koffi 绑定（Win32 导出名＋参数元数）↔ types/contract-native-koffi.d.ts
      # 契约登记，匹配键＝Win32 导出名（deleteTab 走 COM vtable、字面名产品码 0 命中是正常现象，
      # needle 搜产品码这条路对契约不成立——票 14-M §五）。件内登记表是第三锚点：契约与绑定**同时**
      # 改坏同一名在两两比对下恒绿（同源恒真，§91 同族），对照登记表才红（红法 M6）；改任何一侧
      # 都必须有意识更新该件（棘轮语义）。纯 node 零依赖零实例；与 14-L 的 T6 互补——
      # T6 管「契约自己的用例真被 tsc 检」，本件管「契约 == 真源绑定」。
      - name: koffi 绑定⇄契约接线闸（双向相等＋登记表第三锚）
        run: node tools/verify-koffi-contract.js

      # toast 归属名顺序不变量（票 14-S 任务 3，CI 第 21 件）：shell 在某 AUMID 的**第一条**通知落地时
      # 就解析并缓存归属名，之后补写键不回头改（探针三档实测）——所以「DisplayName 键早于首条通知」是
      # 必须守住的不变量，而旧代码用异步 execFile 在启动路径注册，安全全靠「启动毫秒级 vs 通知几十分钟后」
      # 这个时序巧合，没有任何东西守着。本件 vm 真调 ensureAumidDisplayName（桩 execFileSync）考三态措辞/
      # 写入键名（件内 PINNED 第三锚，S-b 错键名红）/同步完成（退回 execFile 异步红），再按 bootApp 体内
      # 行号考注册点早于任何可发通知的调用点（把注册挪到 restartReminder 之后＝S-a 必红）。
      # ⚠ **能力边界（件输出第一行就打印）**：归属名没有自动判据面（Setting 读回空串／History 抛空引用），
      #   本件判不了「通知中心显示的是不是这个名字」，只判顺序与注册行为——写不成显示名判据就别写成假守卫（§91 同族）。
      - name: toast 归属名顺序不变量（注册早于首条通知＋三态措辞）
        run: node tools/verify-toast-aumid-order.js

      # Ctrl+三击「为什么没成」的留痕（票 14-U 任务 A/C，CI 第 22 件）：真人实测 9/30≈30%，
      # 而 21 次丢弃在日志里零行——三条静默出口（OS 连击计数不是 3／Ctrl 掉一拍／点在桌宠身上）
      # 互斥性无法区分，归因只能编机理链。本件先把「没成」变成读数，**不改触发语义**：
      # 三层牙齿——①行为级：真驱动 walk.js 的 detector＋gestureTrace（R/T 组：原因枚举、
      #   一次手势最多一行、30 次尝试恰 30 行不是 90 行）；②**vm 真跑 main.js 的 onGlobalMouseDown**
      #   （V 组：§83/§63 的共性是判定层全绿而运行时路径炸了，字面接线断言审不出拼错变量名，
      #   所以断言的是真落进 logLine 的那几行）；③接线级：五个出口**按分支体定界**（W 组）＋
      #   边界拍照（G 组：`clicks === 3` 恰好 3、三个阈值、自攒兜底仍只在 !osAvailable 时跑——
      #   A′ 未拍板前不许两路并行，否则六连点会被算成两次三击）。
      # ⚠ 能力边界（件输出第一行就打印）：判不了「真实鼠标点击有没有到钩子」；「只点两下就停手」
      #   这类丢弃有意不留行——加定时器去猜「串断了」会把实测 700ms 间隔也认的慢三击谎报成未成。
      #   真人复测的数法因此是「未成行数 ≤ 尝试次数」，缺的那部分正是这条边界。
      - name: 三击未成留痕（原因枚举＋限流＋vm 真跑出口接线）
        run: node tools/verify-tripleclick-trace.js
